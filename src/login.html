<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar — Halloween Viral</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="decor.css"><style>.auth-divider{display:flex;align-items:center;gap:12px;margin:26px 0 4px;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em}.auth-divider:before,.auth-divider:after{content:"";flex:1;height:1px;background:var(--line)}#code-form .button{margin-top:18px}#access-code{letter-spacing:.35em;font-size:1.2rem;text-align:center}</style></head><body class="auth-page"><main class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">HV</span><span>HALLOWEEN <b>VIRAL</b></span></a><p class="eyebrow">Acceso de compradores</p><h1>Volvé a tu biblioteca.</h1><p>Si compraste con un Gmail, ingresá con Google usando ese mismo correo.</p><button class="button button-primary" id="google-login">Continuar con Google</button><div class="auth-divider">¿Tu correo no es Gmail?</div><form id="code-form" novalidate><label for="access-email">Correo de tu compra</label><input id="access-email" type="email" inputmode="email" autocomplete="email" placeholder="tucorreo@hotmail.com" required><label for="access-code">Código de acceso</label><input id="access-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required><button class="button button-ghost" type="submit" id="code-login">Ingresar con código</button></form><p class="notice">Tu acceso es personal y de por vida. ¿No tenés tu código o compraste con otro correo? Escribinos por WhatsApp y te lo enviamos.</p><p id="login-status" aria-live="polite"></p></main><script type="module" src="auth.js"></script></body></html>
