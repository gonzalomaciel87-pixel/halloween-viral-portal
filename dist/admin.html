<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compradores — Halloween Viral</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="decor.css"></head><body class="portal-body"><nav class="portal-nav"><div class="shell"><a class="brand" href="portal"><span class="brand-mark">HV</span><span>HALLOWEEN <b>VIRAL</b></span></a><button class="button button-ghost" id="logout">Cerrar sesión</button></div></nav><main class="shell admin-shell"><section class="admin-intro"><p class="eyebrow">Administración privada</p><h1>Accesos de compradores</h1><p>Agregá el correo de Google utilizado por cada comprador. El sistema lo convertirá automáticamente a minúsculas.</p></section><section class="admin-panel"><form id="buyer-form"><label for="buyer-email">Correo del comprador</label><input id="buyer-email" name="email" type="email" inputmode="email" autocomplete="off" placeholder="comprador@gmail.com" required><label for="buyer-notes">Notas</label><input id="buyer-notes" name="notes" type="text" value="Pago por transferencia" maxlength="500"><button class="button button-primary" type="submit">Habilitar acceso de por vida</button><p id="admin-status" aria-live="polite"></p></form></section><section class="admin-list-section"><div class="portal-section-head"><div><p class="eyebrow">Registro</p><h2>Correos habilitados</h2></div><button class="button button-ghost" id="refresh" type="button">Actualizar</button></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Correo</th><th>Estado</th><th>Fecha</th></tr></thead><tbody id="buyer-list"><tr><td colspan="3">Cargando…</td></tr></tbody></table></div></section></main><script type="module" src="admin.js"></script></body></html>
